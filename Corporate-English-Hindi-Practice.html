<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Corporate English · One card · Daily tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #f0f4fa;
      padding: 16px 12px 30px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #1e293b;
      line-height: 1.5;
    }

    .app-container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    /* header */
    .header {
      text-align: center;
      margin-bottom: 12px;
      padding: 8px 4px 4px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(145deg, #1e2b3c, #0b1a2a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .subhead {
      font-size: 0.85rem;
      color: #475569;
      background: #e9eef3;
      display: inline-block;
      padding: 4px 16px;
      border-radius: 40px;
      font-weight: 500;
      margin-top: 6px;
    }

    /* stats / progress */
    .stats-bar {
      background: white;
      border-radius: 24px;
      padding: 12px 18px;
      margin: 10px 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      border: 1px solid #dbe1e9;
      font-size: 0.9rem;
      font-weight: 500;
      color: #2c3e5c;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stats-bar span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      background: #e1f2ed;
      color: #176b5c;
      padding: 4px 12px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.8rem;
    }

    /* card */
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 24px 20px 20px;
      margin-bottom: 22px;
      box-shadow: 0 12px 28px -8px rgba(0, 20, 40, 0.12), 0 4px 12px rgba(0, 0, 0, 0.02);
      border: 1px solid #e7edf4;
      transition: opacity 0.2s ease;
      word-break: break-word;
      position: relative;
    }

    .card-read {
      opacity: 0.65;
      border-left: 6px solid #1d9e6f;
    }

    .word-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 8px 12px;
    }

    .word {
      font-size: 1.65rem;
      font-weight: 700;
      color: #0b1e33;
      letter-spacing: -0.01em;
      background: #ebf2fa;
      padding: 4px 20px 4px 16px;
      border-radius: 50px;
      display: inline-block;
      line-height: 1.3;
      word-break: break-word;
    }

    .hindi {
      font-size: 1.2rem;
      font-weight: 600;
      color: #176b5c;
      background: #e1f2ed;
      padding: 4px 20px 4px 16px;
      border-radius: 50px;
      display: inline-block;
      line-height: 1.3;
      word-break: break-word;
      margin-left: auto;
    }

    .example-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .example-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 1rem;
      color: #1e2a3a;
      background: #f8fafd;
      padding: 14px 16px;
      border-radius: 20px;
      border-left: 4px solid #3b7cbf;
      line-height: 1.5;
      word-break: break-word;
    }

    .example-item .num {
      font-weight: 700;
      color: #3b7cbf;
      min-width: 20px;
      font-size: 0.95rem;
      opacity: 0.8;
    }

    .example-text {
      flex: 1;
    }

    /* read button area */
    .action-area {
      display: flex;
      justify-content: center;
      margin: 8px 0 10px;
    }

    .btn-read {
      background: #1d7e5c;
      color: white;
      border: none;
      border-radius: 60px;
      padding: 16px 36px;
      font-size: 1.2rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 20px -8px rgba(29, 126, 92, 0.35);
      transition: all 0.15s ease;
      cursor: pointer;
      border: 1px solid #1a6e50;
      letter-spacing: 0.01em;
      width: 100%;
      max-width: 320px;
    }

    .btn-read:active {
      transform: scale(0.97);
      box-shadow: 0 4px 12px -4px rgba(29, 126, 92, 0.4);
      background: #166b4d;
    }

    .btn-read.read-done {
      background: #6b8a9e;
      border-color: #5a7a8c;
      box-shadow: 0 6px 14px -6px rgba(0,0,0,0.15);
      cursor: default;
      opacity: 0.8;
    }

    .btn-read.read-done:active {
      transform: none;
    }

    /* navigation */
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 10px 0 8px;
    }

    .nav-btn {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 50px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #1e3a5f;
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      transition: background 0.1s ease;
      cursor: pointer;
    }

    .nav-btn:active {
      background: #eef4fb;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
      background: #f1f5f9;
    }

    /* progress tracker */
    .tracker-section {
      background: #ffffffdd;
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 18px 16px;
      margin-top: 24px;
      border: 1px solid #d9e2ec;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02);
    }

    .tracker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 600;
      color: #1e3a5f;
      font-size: 1rem;
    }

    .reset-btn {
      background: none;
      border: 1px solid #d0dae8;
      border-radius: 30px;
      padding: 6px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #4e6b8c;
      cursor: pointer;
      transition: background 0.1s;
    }

    .reset-btn:active {
      background: #eef2f8;
    }

    .day-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 12px;
      margin-top: 6px;
    }

    .day-badge {
      background: #f1f6fc;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #2b4058;
      border: 1px solid #d6e2f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .day-badge .count {
      background: #1d7e5c;
      color: white;
      border-radius: 40px;
      padding: 1px 9px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .footer-note {
      text-align: center;
      margin-top: 28px;
      font-size: 0.75rem;
      color: #6b7f99;
      padding: 12px;
      border-top: 1px solid #d0ddee;
    }

    .no-card-message {
      background: white;
      border-radius: 28px;
      padding: 40px 20px;
      text-align: center;
      color: #4f658b;
      font-weight: 500;
      border: 1px dashed #b9c8da;
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    /* small screens */
    @media (max-width: 400px) {
      .word {
        font-size: 1.4rem;
      }
      .hindi {
        font-size: 1rem;
      }
      .example-item {
        font-size: 0.9rem;
        padding: 12px 12px;
      }
      .btn-read {
        font-size: 1.1rem;
        padding: 14px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- header -->
    <div class="header">
      <h1>Corporate English</h1>
      <div class="subhead">🇮🇳 Hindi + English · one card at a time</div>
    </div>

    <!-- stats bar: today's count + total read -->
    <div class="stats-bar" id="statsBar">
      <span>📅 Today: <span id="todayCount" class="badge">0</span></span>
      <span>✅ Total read: <span id="totalReadCount" class="badge">0</span></span>
    </div>

    <!-- card container -->
    <div id="cardContainer">
      <!-- dynamic card will appear here -->
    </div>

    <!-- navigation + read button -->
    <div class="action-area">
      <button class="btn-read" id="readBtn">✅ Mark as read</button>
    </div>

    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn">◀ Previous</button>
      <button class="nav-btn" id="nextBtn">Next ▶</button>
    </div>

    <!-- progress tracker per day -->
    <div class="tracker-section">
      <div class="tracker-header">
        <span>📊 Read count by day</span>
        <button class="reset-btn" id="resetBtn">Reset all</button>
      </div>
      <div class="day-list" id="dayList">
        <!-- day badges will be injected -->
      </div>
    </div>

    <div class="footer-note">
      ✨ Read one card, tap "Mark as read" · progress saved locally
    </div>
  </div>

      // -------------------- STATE & STORAGE --------------------
      const STORAGE_KEY = 'corpEng_readTracker_v1';
      const DAILY_KEY = 'corpEng_dailyCount';

      // state
      let currentIndex = 0;
      let readSet = new Set();          // store indices that are marked read (permanent)
      let dailyCounts = {};            // { '2025-04-07': count, ... }

      // load from localStorage
      function loadState() {
        try {
          const savedRead = localStorage.getItem(STORAGE_KEY);
          if (savedRead) {
            readSet = new Set(JSON.parse(savedRead));
          }
          const savedDaily = localStorage.getItem(DAILY_KEY);
          if (savedDaily) {
            dailyCounts = JSON.parse(savedDaily);
          } else {
            dailyCounts = {};
          }
        } catch (e) {
          console.warn('Error loading state', e);
          readSet = new Set();
          dailyCounts = {};
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...readSet]));
        localStorage.setItem(DAILY_KEY, JSON.stringify(dailyCounts));
      }

      // get today's date string YYYY-MM-DD
      function getTodayKey() {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      // increment today's read count
      function incrementTodayCount() {
        const today = getTodayKey();
        dailyCounts[today] = (dailyCounts[today] || 0) + 1;
        saveState();
        updateStatsAndTracker();
      }

      // mark current card as read
      function markCurrentRead() {
        if (readSet.has(currentIndex)) return; // already read
        readSet.add(currentIndex);
        incrementTodayCount();
        saveState();
        renderCard(currentIndex); // re-render with 'read' style
        updateStatsAndTracker();
      }

      // is current card read?
      function isCurrentRead() {
        return readSet.has(currentIndex);
      }

      // -------------------- RENDER --------------------
      const cardContainer = document.getElementById('cardContainer');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const readBtn = document.getElementById('readBtn');
      const todayCountSpan = document.getElementById('todayCount');
      const totalReadCountSpan = document.getElementById('totalReadCount');
      const dayList = document.getElementById('dayList');

      function renderCard(index) {
        if (!allData.length) {
          cardContainer.innerHTML = `<div class="no-card-message">No cards available.</div>`;
          return;
        }
        if (index < 0) index = 0;
        if (index >= allData.length) index = allData.length - 1;
        currentIndex = index;

        const item = allData[currentIndex];
        const isRead = readSet.has(currentIndex);
        const examplesHtml = item.examples.map((ex, i) => 
          `<div class="example-item">
            <span class="num">${i+1}</span>
            <span class="example-text">${escapeHtml(ex)}</span>
          </div>`
        ).join('');

        cardContainer.innerHTML = `
          <div class="card ${isRead ? 'card-read' : ''}">
            <div class="word-row">
              <span class="word">${escapeHtml(item.word)}</span>
              <span class="hindi">${escapeHtml(item.hindi)}</span>
            </div>
            <div class="example-list">
              ${examplesHtml}
            </div>
            ${isRead ? '<div style="margin-top:14px; font-size:0.85rem; color:#1d7e5c; font-weight:600;">✅ Read</div>' : ''}
          </div>
        `;

        // update read button state
        if (isRead) {
          readBtn.textContent = '✅ Read';
          readBtn.classList.add('read-done');
          readBtn.disabled = true;
        } else {
          readBtn.textContent = '✅ Mark as read';
          readBtn.classList.remove('read-done');
          readBtn.disabled = false;
        }

        // update nav buttons
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === allData.length - 1;

        // update stats
        updateStatsAndTracker();
      }

      function updateStatsAndTracker() {
        // total read
        const totalRead = readSet.size;
        totalReadCountSpan.textContent = totalRead;

        // today's count
        const today = getTodayKey();
        const todayCount = dailyCounts[today] || 0;
        todayCountSpan.textContent = todayCount;

        // day list
        const days = Object.keys(dailyCounts).sort((a,b) => b.localeCompare(a)); // recent first
        if (days.length === 0) {
          dayList.innerHTML = '<span style="color:#6b7f99; font-size:0.85rem;">No reads yet. Tap "Mark as read" to start.</span>';
        } else {
          dayList.innerHTML = days.map(day => {
            const count = dailyCounts[day];
            const displayDay = formatDate(day);
            return `<div class="day-badge">${displayDay} <span class="count">${count}</span></div>`;
          }).join('');
        }
      }

      function formatDate(dateStr) {
        const [y, m, d] = dateStr.split('-');
        const date = new Date(y, m-1, d);
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(today.getDate() - 1);
        if (date.toDateString() === today.toDateString()) return 'Today';
        if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
        return `${d}/${m}`;
      }

      // escape helper
      function escapeHtml(unsafe) {
        return unsafe
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // -------------------- NAVIGATION --------------------
      function goPrev() {
        if (currentIndex > 0) {
          renderCard(currentIndex - 1);
        }
      }

      function goNext() {
        if (currentIndex < allData.length - 1) {
          renderCard(currentIndex + 1);
        }
      }

      // reset all data
      function resetAll() {
        if (confirm('Reset all read progress and daily counts?')) {
          readSet.clear();
          dailyCounts = {};
          saveState();
          renderCard(currentIndex); // refresh current
          updateStatsAndTracker();
        }
      }

      // -------------------- INIT --------------------
      function init() {
        loadState();
        // if currentIndex out of bounds, reset
        if (currentIndex >= allData.length) currentIndex = 0;
        renderCard(currentIndex);
        updateStatsAndTracker();

        // event listeners
        prevBtn.addEventListener('click', goPrev);
        nextBtn.addEventListener('click', goNext);
        readBtn.addEventListener('click', markCurrentRead);
        document.getElementById('resetBtn').addEventListener('click', resetAll);

        // swipe? not necessary, but can be added — keep simple
      }

      init();
    })();
  </script>
