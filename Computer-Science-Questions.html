const container = document.getElementById('qaContainer');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const searchBox = document.getElementById('searchBox');

document.getElementById('pageTitle').textContent = '📘 ' + qaData.title;

function getDone() {
  return JSON.parse(localStorage.getItem('qaDone') || '[]');
}

function saveDone(arr) {
  localStorage.setItem('qaDone', JSON.stringify(arr));
}

function render(filter = '') {
  const done = getDone();
  container.innerHTML = '';
  let visibleCount = 0;

  qaData.questions.forEach((item, i) => {
    const text = (item.q + ' ' + item.a).toLowerCase();
    if (filter && !text.includes(filter.toLowerCase())) return;
    visibleCount++;

    const isDone = done.includes(item.id);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <span class="qnum">Q ${item.id}</span>
      <div class="question">${item.q}</div>
      <div class="answer">${item.a}</div>
      <button class="mark-btn ${isDone ? 'done' : ''}" onclick="toggleDone(${item.id})">
        ${isDone ? '✅ Padh liya' : '⭕ Mark as read'}
      </button>
    `;
    container.appendChild(card);
  });

  if (visibleCount === 0) {
    container.innerHTML = '<p style="text-align:center;color:#94a3b8;">Koi question nahi mila</p>';
  }

  updateProgress();
}

function toggleDone(id) {
  let done = getDone();
  if (done.includes(id)) {
    done = done.filter(x => x !== id);
  } else {
    done.push(id);
  }
  saveDone(done);
  render(searchBox.value);
}

function updateProgress() {
  const done = getDone();
  const total = qaData.questions.length;
  const percent = total > 0 ? (done.length / total) * 100 : 0;
  progressFill.style.width = percent + '%';
  progressText.textContent = `${done.length} / ${total} padhe`;
  document.getElementById('footerText').textContent =
    done.length === total && total > 0 ? '🎉 Sab padh liya!' : `Baaki: ${total - done.length}`;
}

function resetProgress() {
  if (confirm('Progress reset karna hai?')) {
    saveDone([]);
    render(searchBox.value);
  }
}

searchBox.addEventListener('input', (e) => render(e.target.value));

render();
