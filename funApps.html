<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Fun Games Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            height: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header, .tabs {
            flex-shrink: 0;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
            overflow-x: auto;
        }

        .tab-button {
            flex: 1;
            min-width: 110px;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }

        .tab-button:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .content {
            padding: 30px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* General Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Tic-Tac-Toe */
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 300px;
            margin: 20px auto;
        }

        .cell {
            width: 90px;
            height: 90px;
            background: #f0f0f0;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
        }

        .cell:hover {
            background: #e8eaf6;
        }

        .status {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
            margin: 15px 0;
        }

        /* Memory Game */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 400px;
            margin: 20px auto;
        }

        .memory-card {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            cursor: pointer;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            color: transparent;
        }

        .memory-card.flipped {
            color: white;
            transform: rotateY(180deg);
        }

        .memory-card.matched {
            background: #4caf50;
            cursor: default;
        }

        /* Snake Game */
        .snake-canvas {
            border: 3px solid #667eea;
            background: black;
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        .snake-controls {
            text-align: center;
            margin-top: 20px;
        }


        /* Mobile: fit the whole app in one screen */
        @media (max-width: 600px) {
            body { padding: 6px; }
            .container { border-radius: 10px; }

            .header { padding: 10px; }
            .header h1 { font-size: 20px; margin-bottom: 0; }
            .header p { display: none; }

            /* Tabs on one row, swipe sideways */
            .tabs {
                flex-wrap: nowrap;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .tabs::-webkit-scrollbar { display: none; }
            .tab-button {
                flex: 1 0 auto;
                min-width: 0;
                padding: 10px 12px;
            }

            .content { padding: 12px; }
            .content h2 { font-size: 18px; margin-bottom: 6px; }

            button { padding: 9px 16px; margin-right: 6px; margin-bottom: 6px; }
            button:hover { transform: none; }

            .status { font-size: 15px; margin: 8px 0; }

            .game-board { max-width: 240px; gap: 8px; margin: 10px auto; }
            .cell { width: 100%; height: auto; aspect-ratio: 1; font-size: 28px; }

            .memory-grid { max-width: 280px; gap: 8px; margin: 10px auto; }
            .memory-card { width: 100%; height: auto; aspect-ratio: 1; font-size: 28px; }

            .snake-canvas { width: min(100%, 52vh); margin: 10px auto; }
            .snake-controls { margin-top: 8px; }

        }

        .game-info {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Fun Games Collection</h1>
            <p>Play & enjoy various games and fun apps</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('tictactoe')">🎯 Tic-Tac-Toe</button>
            <button class="tab-button" onclick="switchTab('memory')">🧠 Memory Game</button>
            <button class="tab-button" onclick="switchTab('snake')">🐍 Snake</button>
        </div>

        <div class="content">
            <!-- Tic-Tac-Toe -->
            <div id="tictactoe" class="tab-content active">
                <h2>🎯 Tic-Tac-Toe</h2>
                <div class="status" id="tttStatus">You (X) vs AI (O)</div>
                <div class="game-board" id="tttBoard"></div>
                <div style="text-align: center;">
                    <button onclick="resetTTT()">New Game</button>
                </div>
            </div>

            <!-- Memory Game -->
            <div id="memory" class="tab-content">
                <h2>🧠 Memory Card Game</h2>
                <div style="text-align: center; margin: 15px 0;">
                    Moves: <strong id="memoryMoves">0</strong>
                </div>
                <div class="memory-grid" id="memoryGrid"></div>
                <div style="text-align: center;">
                    <button onclick="resetMemory()">New Game</button>
                </div>
            </div>

            <!-- Snake Game -->
            <div id="snake" class="tab-content">
                <h2>🐍 Snake Game</h2>
                <div style="text-align: center;">
                    Score: <strong id="snakeScore">0</strong>
                </div>
                <canvas id="snakeCanvas" class="snake-canvas" width="400" height="400"></canvas>
                <div class="snake-controls">
                    <button id="snakeStart" onclick="startSnakeGame()">Start Game</button>
                    <button class="secondary" id="snakePause" onclick="pauseSnakeGame()" style="display: none;">Pause</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            event.target.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
        }

        // ==================== TIC-TAC-TOE ====================
        let tttBoard = ['', '', '', '', '', '', '', '', ''];
        let tttGameOver = false;

        function initTTT() {
            const board = document.getElementById('tttBoard');
            board.innerHTML = '';
            tttBoard = ['', '', '', '', '', '', '', '', ''];
            tttGameOver = false;
            updateTTTStatus("You (X) vs AI (O)");

            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => playTTT(i);
                board.appendChild(cell);
            }
        }

        function playTTT(index) {
            if (tttBoard[index] || tttGameOver) return;
            tttBoard[index] = 'X';
            updateTTTBoard();
            
            if (checkTTTWinner('X')) {
                updateTTTStatus("🎉 You Won!");
                tttGameOver = true;
                return;
            }

            if (tttBoard.every(cell => cell)) {
                updateTTTStatus("🤝 Draw!");
                tttGameOver = true;
                return;
            }

            setTimeout(() => aiTTT(), 500);
        }

        function aiTTT() {
            const empty = tttBoard.map((cell, i) => cell === '' ? i : null).filter(i => i !== null);
            const index = empty[Math.floor(Math.random() * empty.length)];
            tttBoard[index] = 'O';
            updateTTTBoard();

            if (checkTTTWinner('O')) {
                updateTTTStatus("😢 AI Won!");
                tttGameOver = true;
                return;
            }

            if (tttBoard.every(cell => cell)) {
                updateTTTStatus("🤝 Draw!");
                tttGameOver = true;
            }
        }

        function checkTTTWinner(player) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(w => w.every(i => tttBoard[i] === player));
        }

        function updateTTTBoard() {
            const cells = document.querySelectorAll('.cell');
            tttBoard.forEach((cell, i) => {
                cells[i].textContent = cell;
            });
        }

        function updateTTTStatus(text) {
            document.getElementById('tttStatus').textContent = text;
        }

        function resetTTT() {
            initTTT();
        }

        initTTT();

        // ==================== MEMORY GAME ====================
        let memoryCards = [];
        let flipped = [];
        let matched = 0;
        let moves = 0;

        function initMemory() {
            const emojis = ['🎨', '🎯', '🎲', '🎪', '🎬', '🎤', '🎧', '🎸'];
            memoryCards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
            flipped = [];
            matched = 0;
            moves = 0;
            document.getElementById('memoryMoves').textContent = 0;

            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';

            memoryCards.forEach((emoji, i) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.textContent = emoji;
                card.onclick = () => flipMemoryCard(i, card);
                grid.appendChild(card);
            });
        }

        function flipMemoryCard(index, element) {
            if (flipped.length === 2 || flipped.includes(index)) return;

            element.classList.add('flipped');
            flipped.push(index);

            if (flipped.length === 2) {
                moves++;
                document.getElementById('memoryMoves').textContent = moves;

                if (memoryCards[flipped[0]] === memoryCards[flipped[1]]) {
                    matched += 2;
                    document.querySelectorAll('.memory-card').forEach((card, i) => {
                        if (flipped.includes(i)) card.classList.add('matched');
                    });
                    flipped = [];

                    if (matched === memoryCards.length) {
                        setTimeout(() => alert(`🎉 You Won! Moves: ${moves}`), 300);
                    }
                } else {
                    setTimeout(() => {
                        document.querySelectorAll('.memory-card').forEach((card, i) => {
                            if (flipped.includes(i)) card.classList.remove('flipped');
                        });
                        flipped = [];
                    }, 1000);
                }
            }
        }

        function resetMemory() {
            initMemory();
        }

        initMemory();

        // ==================== SNAKE GAME ====================
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        let snake = [{x: 200, y: 200}];
        let food = {x: 100, y: 100};
        let dx = 10, dy = 0;
        let snakeGameRunning = false;
        let snakeScore = 0;

        document.addEventListener('keydown', (e) => {
            // Stop arrow keys from scrolling while snake is running
            if (snakeGameRunning && e.key.startsWith('Arrow')) e.preventDefault();
            if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -10; }
            if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 10; }
            if (e.key === 'ArrowLeft' && dx === 0) { dx = -10; dy = 0; }
            if (e.key === 'ArrowRight' && dx === 0) { dx = 10; dy = 0; }
        });

        // Swipe controls for mobile
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        canvas.addEventListener('touchend', (e) => {
            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;
            if (Math.max(Math.abs(diffX), Math.abs(diffY)) < 20) return;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0 && dx === 0) { dx = 10; dy = 0; }
                if (diffX < 0 && dx === 0) { dx = -10; dy = 0; }
            } else {
                if (diffY > 0 && dy === 0) { dx = 0; dy = 10; }
                if (diffY < 0 && dy === 0) { dx = 0; dy = -10; }
            }
        });

        function drawSnakeGame() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            snake.forEach((segment, i) => {
                ctx.fillStyle = i === 0 ? '#4caf50' : '#8bc34a';
                ctx.fillRect(segment.x, segment.y, 10, 10);
                ctx.strokeStyle = '#333';
                ctx.strokeRect(segment.x, segment.y, 10, 10);
            });

            ctx.fillStyle = '#ff5722';
            ctx.beginPath();
            ctx.arc(food.x + 5, food.y + 5, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function updateSnakeGame() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height ||
                snake.some(s => s.x === head.x && s.y === head.y)) {
                snakeGameRunning = false;
                document.getElementById('snakeStart').style.display = 'inline-block';
                document.getElementById('snakePause').style.display = 'none';
                alert(`Game Over! Score: ${snakeScore}`);
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                snakeScore++;
                document.getElementById('snakeScore').textContent = snakeScore;
                food = {x: Math.floor(Math.random() * 40) * 10, y: Math.floor(Math.random() * 40) * 10};
            } else {
                snake.pop();
            }

            drawSnakeGame();
        }

        function startSnakeGame() {
            snakeGameRunning = true;
            snakeScore = 0;
            snake = [{x: 200, y: 200}];
            dx = 10; dy = 0;
            document.getElementById('snakeScore').textContent = 0;
            document.getElementById('snakeStart').style.display = 'none';
            document.getElementById('snakePause').style.display = 'inline-block';

            const gameLoop = setInterval(() => {
                if (!snakeGameRunning) {
                    clearInterval(gameLoop);
                } else {
                    updateSnakeGame();
                }
            }, 100);
        }

        function pauseSnakeGame() {
            snakeGameRunning = false;
        }

        drawSnakeGame();

    </script>
</body>
</html>
