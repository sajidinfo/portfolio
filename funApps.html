<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Fun Games Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Height left for a game after page padding and content padding */
            --avail-h: calc(100vh - 72px);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px;
        }

        .container {
            max-width: 1200px;
            height: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
        }

        /* Sidebar with game list */
        .tabs {
            flex-shrink: 0;
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 16px 0;
            background: #f5f5f5;
            border-right: 2px solid #ddd;
        }

        .tab-button {
            padding: 14px 20px;
            margin: 0;
            border: none;
            border-radius: 0;
            border-left: 4px solid transparent;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #666;
            text-align: left;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .tab-button:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: none;
        }

        .tab-button.active {
            color: #667eea;
            border-left-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .content {
            flex: 1;
            min-width: 0;
            padding: 20px;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .game-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
        }

        .status {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
            margin: 8px 0 14px;
        }

        .status:empty {
            display: none;
        }

        /* Tic-Tac-Toe */
        .game-board {
            container-type: inline-size;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: min(100%, calc(var(--avail-h) - 130px), 480px);
        }

        .cell {
            aspect-ratio: 1;
            background: #f0f0f0;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16cqw;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
        }

        .cell:hover {
            background: #e8eaf6;
        }

        /* Memory Game */
        .memory-levels {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .memory-levels button {
            padding: 8px 14px;
            background: #e8eaf6;
            color: #667eea;
        }

        .memory-levels button.active {
            background: #667eea;
            color: white;
        }

        .memory-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
        }

        .memory-grid {
            --cols: 4;
            --rows: 4;
            container-type: inline-size;
            display: grid;
            grid-template-columns: repeat(var(--cols), 1fr);
            gap: 6px;
            /* Fit both the available width and height */
            width: min(100%, calc((var(--avail-h) - 200px) * var(--cols) / var(--rows)), calc(var(--cols) * 110px));
        }

        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            cursor: pointer;
            font-size: calc(55cqw / var(--cols));
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            color: transparent;
        }

        .memory-card.flipped {
            color: white;
            transform: rotateY(180deg);
        }

        .memory-card.matched {
            background: #4caf50;
            cursor: default;
        }

        /* Snake Game */
        .snake-score {
            margin-bottom: 8px;
        }

        .snake-canvas {
            border: 3px solid #667eea;
            background: black;
            display: block;
            border-radius: 8px;
            width: min(100%, calc(var(--avail-h) - 110px), 600px);
            height: auto;
            touch-action: none;
        }

        /* Mobile: tabs on top, game fills the rest */
        @media (max-width: 700px) {
            :root {
                --avail-h: calc(100vh - 66px);
                --avail-h: calc(100dvh - 66px);
            }

            body { padding: 0; }
            .container { border-radius: 0; flex-direction: column; }

            .tabs {
                width: auto;
                flex-direction: row;
                gap: 0;
                padding: 0;
                border-right: none;
                border-bottom: 2px solid #ddd;
            }
            .tab-button {
                flex: 1;
                padding: 12px 6px;
                font-size: 13px;
                text-align: center;
                border-left: none;
                border-bottom: 3px solid transparent;
            }
            .tab-button.active { border-bottom-color: #667eea; }

            .content { padding: 10px; }

            button { padding: 9px 16px; }
            button:hover { transform: none; }

            .status { font-size: 15px; margin: 4px 0 10px; }
            .memory-levels button { padding: 7px 10px; font-size: 12px; }
            .memory-info { margin: 6px 0; font-size: 14px; }
            .game-actions { margin-top: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('tictactoe', this)">🎯 Tic-Tac-Toe</button>
            <button class="tab-button" onclick="switchTab('memory', this)">🧠 Memory Game</button>
            <button class="tab-button" onclick="switchTab('snake', this)">🐍 Snake</button>
        </div>

        <div class="content">
            <!-- Tic-Tac-Toe -->
            <div id="tictactoe" class="tab-content active">
                <div class="status" id="tttStatus">You (X) vs AI (O)</div>
                <div class="game-board" id="tttBoard"></div>
                <div class="game-actions">
                    <button onclick="resetTTT()">New Game</button>
                </div>
            </div>

            <!-- Memory Game -->
            <div id="memory" class="tab-content">
                <div class="memory-levels">
                    <button class="active" onclick="setMemoryLevel('easy', this)">Easy</button>
                    <button onclick="setMemoryLevel('medium', this)">Medium</button>
                    <button onclick="setMemoryLevel('hard', this)">Hard</button>
                    <button onclick="setMemoryLevel('extra', this)">Extra Hard</button>
                </div>
                <div class="memory-info">
                    <span>Moves: <strong id="memoryMoves">0</strong></span>
                    <span>Time: <strong id="memoryTime">0s</strong></span>
                </div>
                <div class="status" id="memoryStatus"></div>
                <div class="memory-grid" id="memoryGrid"></div>
                <div class="game-actions">
                    <button onclick="resetMemory()">New Game</button>
                </div>
            </div>

            <!-- Snake Game -->
            <div id="snake" class="tab-content">
                <div class="snake-score">
                    Score: <strong id="snakeScore">0</strong>
                </div>
                <canvas id="snakeCanvas" class="snake-canvas" width="400" height="400"></canvas>
                <div class="game-actions">
                    <button id="snakeStart" onclick="startSnakeGame()">Start Game</button>
                    <button class="secondary" id="snakePause" onclick="pauseSnakeGame()" style="display: none;">Pause</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Tab switching
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            btn.classList.add('active');
            btn.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
        }

        // ==================== TIC-TAC-TOE ====================
        let tttBoard = ['', '', '', '', '', '', '', '', ''];
        let tttGameOver = false;

        function initTTT() {
            const board = document.getElementById('tttBoard');
            board.innerHTML = '';
            tttBoard = ['', '', '', '', '', '', '', '', ''];
            tttGameOver = false;
            updateTTTStatus("You (X) vs AI (O)");

            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => playTTT(i);
                board.appendChild(cell);
            }
        }

        function playTTT(index) {
            if (tttBoard[index] || tttGameOver) return;
            tttBoard[index] = 'X';
            updateTTTBoard();
            
            if (checkTTTWinner('X')) {
                updateTTTStatus("🎉 You Won!");
                tttGameOver = true;
                return;
            }

            if (tttBoard.every(cell => cell)) {
                updateTTTStatus("🤝 Draw!");
                tttGameOver = true;
                return;
            }

            setTimeout(() => aiTTT(), 500);
        }

        function aiTTT() {
            const empty = tttBoard.map((cell, i) => cell === '' ? i : null).filter(i => i !== null);
            const index = empty[Math.floor(Math.random() * empty.length)];
            tttBoard[index] = 'O';
            updateTTTBoard();

            if (checkTTTWinner('O')) {
                updateTTTStatus("😢 AI Won!");
                tttGameOver = true;
                return;
            }

            if (tttBoard.every(cell => cell)) {
                updateTTTStatus("🤝 Draw!");
                tttGameOver = true;
            }
        }

        function checkTTTWinner(player) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(w => w.every(i => tttBoard[i] === player));
        }

        function updateTTTBoard() {
            const cells = document.querySelectorAll('.cell');
            tttBoard.forEach((cell, i) => {
                cells[i].textContent = cell;
            });
        }

        function updateTTTStatus(text) {
            document.getElementById('tttStatus').textContent = text;
        }

        function resetTTT() {
            initTTT();
        }

        initTTT();

        // ==================== MEMORY GAME ====================
        // pairs: number of pairs, cols: grid columns, flipBack: ms before wrong cards hide,
        // timeLimit: seconds (0 = no limit), similar: use look-alike emojis
        const memoryLevels = {
            easy:   { pairs: 8,  cols: 4, flipBack: 1000, timeLimit: 0,   similar: false },
            medium: { pairs: 12, cols: 6, flipBack: 800,  timeLimit: 120, similar: false },
            hard:   { pairs: 18, cols: 6, flipBack: 600,  timeLimit: 150, similar: false },
            extra:  { pairs: 18, cols: 6, flipBack: 400,  timeLimit: 120, similar: true }
        };
        const memoryEmojis = ['🎨', '🎯', '🎲', '🎪', '🎬', '🎤', '🎧', '🎸', '🚀', '🌈',
                              '🍕', '⚽', '🐱', '🦊', '🌵', '🍩', '🎁', '👑'];
        const memorySimilarEmojis = ['😀', '😃', '😄', '😁', '😆', '😅', '😂', '🤣', '🙂',
                                     '🙃', '😉', '😊', '😇', '🥰', '😍', '🤩', '😘', '😗'];

        let memoryLevel = 'easy';
        let memoryCards = [];
        let flipped = [];
        let matched = 0;
        let moves = 0;
        let memorySeconds = 0;
        let memoryTimer = null;
        let memoryOver = false;

        function setMemoryLevel(level, btn) {
            memoryLevel = level;
            document.querySelectorAll('.memory-levels button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initMemory();
        }

        function initMemory() {
            const level = memoryLevels[memoryLevel];
            const pool = level.similar ? memorySimilarEmojis : memoryEmojis;
            const emojis = [...pool].sort(() => Math.random() - 0.5).slice(0, level.pairs);
            memoryCards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
            flipped = [];
            matched = 0;
            moves = 0;
            memorySeconds = 0;
            memoryOver = false;
            clearInterval(memoryTimer);
            memoryTimer = null;
            document.getElementById('memoryMoves').textContent = 0;
            document.getElementById('memoryStatus').textContent = level.timeLimit
                ? `⏱️ Match all pairs in ${level.timeLimit}s` : '';
            updateMemoryTime();

            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';
            grid.style.setProperty('--cols', level.cols);
            grid.style.setProperty('--rows', memoryCards.length / level.cols);

            memoryCards.forEach((emoji, i) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.textContent = emoji;
                card.onclick = () => flipMemoryCard(i, card);
                grid.appendChild(card);
            });
        }

        function updateMemoryTime() {
            const limit = memoryLevels[memoryLevel].timeLimit;
            const shown = limit ? limit - memorySeconds : memorySeconds;
            document.getElementById('memoryTime').textContent = shown + 's';
        }

        function startMemoryTimer() {
            memoryTimer = setInterval(() => {
                memorySeconds++;
                updateMemoryTime();
                const limit = memoryLevels[memoryLevel].timeLimit;
                if (limit && memorySeconds >= limit) {
                    endMemory(false);
                }
            }, 1000);
        }

        function endMemory(won) {
            memoryOver = true;
            clearInterval(memoryTimer);
            document.getElementById('memoryStatus').textContent = won
                ? `🎉 You Won! Moves: ${moves}, Time: ${memorySeconds}s`
                : '⏰ Time Up! Try again';
            if (!won) {
                document.querySelectorAll('.memory-card').forEach(card => card.classList.add('flipped'));
            }
        }

        function flipMemoryCard(index, element) {
            if (memoryOver || flipped.length === 2 || flipped.includes(index) ||
                element.classList.contains('matched')) return;
            if (!memoryTimer) startMemoryTimer();

            element.classList.add('flipped');
            flipped.push(index);

            if (flipped.length === 2) {
                moves++;
                document.getElementById('memoryMoves').textContent = moves;

                if (memoryCards[flipped[0]] === memoryCards[flipped[1]]) {
                    matched += 2;
                    document.querySelectorAll('.memory-card').forEach((card, i) => {
                        if (flipped.includes(i)) card.classList.add('matched');
                    });
                    flipped = [];

                    if (matched === memoryCards.length) {
                        endMemory(true);
                    }
                } else {
                    const cards = memoryCards;
                    setTimeout(() => {
                        // Skip if a new game started meanwhile
                        if (cards !== memoryCards || memoryOver) return;
                        document.querySelectorAll('.memory-card').forEach((card, i) => {
                            if (flipped.includes(i)) card.classList.remove('flipped');
                        });
                        flipped = [];
                    }, memoryLevels[memoryLevel].flipBack);
                }
            }
        }

        function resetMemory() {
            initMemory();
        }

        initMemory();

        // ==================== SNAKE GAME ====================
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        let snake = [{x: 200, y: 200}];
        let food = {x: 100, y: 100};
        let dx = 10, dy = 0;
        let snakeGameRunning = false;
        let snakeScore = 0;

        document.addEventListener('keydown', (e) => {
            // Stop arrow keys from scrolling while snake is running
            if (snakeGameRunning && e.key.startsWith('Arrow')) e.preventDefault();
            if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -10; }
            if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 10; }
            if (e.key === 'ArrowLeft' && dx === 0) { dx = -10; dy = 0; }
            if (e.key === 'ArrowRight' && dx === 0) { dx = 10; dy = 0; }
        });

        // Swipe controls for mobile
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        canvas.addEventListener('touchend', (e) => {
            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;
            if (Math.max(Math.abs(diffX), Math.abs(diffY)) < 20) return;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0 && dx === 0) { dx = 10; dy = 0; }
                if (diffX < 0 && dx === 0) { dx = -10; dy = 0; }
            } else {
                if (diffY > 0 && dy === 0) { dx = 0; dy = 10; }
                if (diffY < 0 && dy === 0) { dx = 0; dy = -10; }
            }
        });

        function drawSnakeGame() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            snake.forEach((segment, i) => {
                ctx.fillStyle = i === 0 ? '#4caf50' : '#8bc34a';
                ctx.fillRect(segment.x, segment.y, 10, 10);
                ctx.strokeStyle = '#333';
                ctx.strokeRect(segment.x, segment.y, 10, 10);
            });

            ctx.fillStyle = '#ff5722';
            ctx.beginPath();
            ctx.arc(food.x + 5, food.y + 5, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function updateSnakeGame() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height ||
                snake.some(s => s.x === head.x && s.y === head.y)) {
                snakeGameRunning = false;
                document.getElementById('snakeStart').style.display = 'inline-block';
                document.getElementById('snakePause').style.display = 'none';
                alert(`Game Over! Score: ${snakeScore}`);
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                snakeScore++;
                document.getElementById('snakeScore').textContent = snakeScore;
                food = {x: Math.floor(Math.random() * 40) * 10, y: Math.floor(Math.random() * 40) * 10};
            } else {
                snake.pop();
            }

            drawSnakeGame();
        }

        function startSnakeGame() {
            snakeGameRunning = true;
            snakeScore = 0;
            snake = [{x: 200, y: 200}];
            dx = 10; dy = 0;
            document.getElementById('snakeScore').textContent = 0;
            document.getElementById('snakeStart').style.display = 'none';
            document.getElementById('snakePause').style.display = 'inline-block';

            const gameLoop = setInterval(() => {
                if (!snakeGameRunning) {
                    clearInterval(gameLoop);
                } else {
                    updateSnakeGame();
                }
            }, 100);
        }

        function pauseSnakeGame() {
            snakeGameRunning = false;
        }

        drawSnakeGame();

    </script>
</body>
</html>
