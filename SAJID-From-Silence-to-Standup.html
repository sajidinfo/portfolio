<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAJID: From Silence to Standup</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #3b2a20;
    --desk-dark: #1c130d;
    --paper: #fbf6ea;
    --paper-edge: #e4d8bd;
    --ink: #2d2620;
    --muted: #8a7b68;
    --accent: #a8322d;
    --font-size: 17px;
  }
  :root[data-theme="night"] {
    --paper: #1f1d1a;
    --paper-edge: #12100e;
    --ink: #e6dccb;
    --muted: #9a8f7e;
    --accent: #e0827b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Lora', Georgia, serif;
    color: var(--ink);
    background: radial-gradient(ellipse at center, var(--desk) 0%, var(--desk-dark) 100%);
    display: flex;
    flex-direction: column;
  }
  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .book {
    position: relative;
    width: min(1200px, 100%, calc((100vh - 120px) * 1.5));
    width: min(1200px, 100%, calc((100dvh - 120px) * 1.5));
    aspect-ratio: 1.5;
    background: var(--paper);
    border-radius: 4px;
    box-shadow:
      0 2px 0 var(--paper-edge),
      0 4px 0 -1px var(--paper),
      0 6px 0 -2px var(--paper-edge),
      0 30px 60px rgba(0,0,0,0.6);
    user-select: text;
    overflow: hidden;
    display: flex;
  }
  .page {
    flex: 1;
    position: relative;
    padding: 48px 52px 56px;
    overflow: hidden;
    background: var(--paper);
  }
  .page.left { box-shadow: inset -20px 0 30px -20px rgba(0,0,0,0.25); }
  .page.right { box-shadow: inset 20px 0 30px -20px rgba(0,0,0,0.25); }
  .book::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 40px;
    transform: translateX(-50%);
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(0,0,0,0.08) 30%,
      rgba(0,0,0,0.22) 50%,
      rgba(0,0,0,0.08) 70%,
      transparent 100%);
    pointer-events: none;
    z-index: 3;
  }
  .folio {
    position: absolute;
    bottom: 24px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .page.left .folio { left: 52px; }
  .page.right .folio { right: 52px; }
  .running-head {
    position: absolute;
    top: 24px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .page.left .running-head { left: 52px; }
  .page.right .running-head { right: 52px; }
  .content {
    height: 100%;
    overflow-y: auto;
    padding-right: 8px;
    font-size: var(--font-size);
    line-height: 1.75;
    text-align: justify;
    hyphens: auto;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }
  .content h2.chapter-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.8em;
    text-align: center;
    margin: 0 0 1.2em;
    line-height: 1.2;
  }
  .content h2.chapter-title .ch-num {
    display: block;
    font-size: 0.5em;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.6em;
    font-family: 'Lora', serif;
    font-weight: 400;
  }
  .content h2.chapter-title::after {
    content: '❦';
    display: block;
    color: var(--accent);
    font-size: 0.7em;
    margin-top: 0.6em;
  }
  .content p { margin: 0 0 0.7em; }
  .content .speaker {
    font-variant: small-caps;
    font-weight: 600;
    color: var(--accent);
    margin-right: 0.2em;
  }
  .content blockquote {
    font-style: italic;
    margin: 0.8em 0.5em;
    padding: 0.6em 1em;
    border-left: 3px solid var(--accent);
    background: rgba(168, 50, 45, 0.07);
    text-align: left;
  }
  .content p.first::first-letter {
    float: left;
    font-family: 'Playfair Display', serif;
    font-size: 3.2em;
    line-height: 0.85;
    padding: 0.05em 0.1em 0 0;
    color: var(--accent);
  }
  .content h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1em;
    margin: 1em 0 0.5em;
    color: var(--accent);
  }
  .content table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.6em 0;
    font-size: 0.85em;
  }
  .content table th,
  .content table td {
    border: 1px solid var(--paper-edge);
    padding: 5px 9px;
    text-align: left;
  }
  .content table th {
    background: rgba(168, 50, 45, 0.08);
    font-weight: 600;
  }
  .content hr {
    border: none;
    text-align: center;
    margin: 1.2em 0;
  }
  .content hr::after {
    content: '❦';
    color: var(--accent);
    font-size: 1em;
  }
  .cover {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, var(--desk) 0%, var(--desk-dark) 100%);
    z-index: 100;
    transition: opacity 0.6s;
  }
  .cover.hidden { opacity: 0; pointer-events: none; }
  .cover-book {
    position: relative;
    height: min(620px, calc(100% - 60px));
    aspect-ratio: 2 / 3;
    background: linear-gradient(135deg, #8a242a 0%, #5a1218 60%, #3d0a0f 100%);
    border-radius: 4px 12px 12px 4px;
    box-shadow: inset 10px 0 18px rgba(0,0,0,0.45), 0 30px 60px rgba(0,0,0,0.6);
    color: #f0d58a;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 28px;
  }
  .cover-book::before {
    content: '';
    position: absolute;
    inset: 16px;
    border: 2px solid rgba(240, 213, 138, 0.55);
    border-radius: 4px 8px 8px 4px;
    pointer-events: none;
  }
  .cover-title {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: clamp(32px, 6vh, 48px);
    line-height: 1.1;
    margin: 18px 0 6px;
  }
  .cover-sub {
    font-style: italic;
    font-size: 18px;
    opacity: 0.9;
    margin-bottom: 8px;
  }
  .cover-meta {
    margin-top: 20px;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .cover-actions {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .cover-actions button {
    padding: 12px 32px;
    border-radius: 30px;
    border: 1px solid #f0d58a;
    background: #f0d58a;
    color: #4a0f14;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Lora', serif;
    transition: transform 0.2s;
  }
  .cover-actions button.ghost {
    background: transparent;
    color: #f0d58a;
  }
  .cover-actions button:hover { transform: translateY(-2px); }
  .bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 16px 14px;
    color: #f3e7d3;
  }
  .bar button {
    min-width: 40px;
    height: 40px;
    padding: 0 14px;
    border-radius: 20px;
    border: 1px solid rgba(243, 231, 211, 0.3);
    background: rgba(255, 255, 255, 0.06);
    color: #f3e7d3;
    font-size: 15px;
    cursor: pointer;
    font-family: 'Lora', serif;
    transition: background 0.2s;
  }
  .bar button:hover:not(:disabled) { background: rgba(255,255,255,0.16); }
  .bar button:disabled { opacity: 0.35; cursor: default; }
  .bar .turn { font-size: 22px; line-height: 1; }
  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(400px, 45vw);
  }
  .progress input { flex: 1; accent-color: #d9a65a; }
  .page-label {
    font-size: 13px;
    white-space: nowrap;
    min-width: 80px;
    text-align: center;
    opacity: 0.85;
  }
  .toc {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 16px;
  }
  .toc.open { display: flex; }
  .toc-panel {
    width: min(500px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    border-radius: 8px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .toc-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px 10px;
    border-bottom: 1px solid var(--paper-edge);
  }
  .toc-head h3 {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
  }
  .toc-head button {
    border: none;
    background: none;
    font-size: 26px;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
  }
  .toc-list {
    list-style: none;
    overflow-y: auto;
    padding: 8px 10px 14px;
  }
  .toc-list button {
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 9px 12px;
    border: none;
    background: none;
    color: var(--ink);
    text-align: left;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    font-family: 'Lora', serif;
  }
  .toc-list button:hover,
  .toc-list button.current {
    background: rgba(168, 50, 45, 0.09);
  }
  .toc-list .n { color: var(--muted); font-size: 12px; min-width: 22px; }
  .toc-list .t { flex: 1; }
  @media (max-width: 899px) {
    .stage { padding: 8px; }
    .book {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
    }
    .page { padding: 32px 22px 44px; }
    .book::before { display: none; }
    .page.left { display: none; }
    .page.right .folio { right: 22px; }
    .page.right .running-head { right: 22px; }
    .progress { flex: 1; width: auto; }
    .progress input { display: none; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>

<div class="cover" id="cover">
  <div class="cover-book">
    <div style="font-size:28px; opacity:0.8;">❦</div>
    <h1 class="cover-title">SAJID</h1>
    <div style="font-size:20px; font-style:italic; opacity:0.85;">From Silence to Standup</div>
    <div class="cover-sub">A Software Engineer's Journey</div>
    <div class="cover-meta">200 Pages · 200 Days</div>
    <div class="cover-actions">
      <button id="startBtn">Start Reading</button>
      <button class="ghost" id="continueBtn" hidden>Continue</button>
    </div>
  </div>
</div>

<div class="stage">
  <div class="book">
    <div class="page left">
      <div class="running-head" id="rhLeft"></div>
      <div class="content" id="contentLeft"></div>
      <div class="folio" id="folioLeft"></div>
    </div>
    <div class="page right">
      <div class="running-head" id="rhRight"></div>
      <div class="content" id="contentRight"></div>
      <div class="folio" id="folioRight"></div>
    </div>
  </div>
</div>

<nav class="bar">
  <button id="tocBtn">☰<span class="hide-sm">&nbsp;Contents</span></button>
  <button class="turn" id="prev">‹</button>
  <div class="progress">
    <input type="range" id="range" min="0" max="0" value="0">
    <span class="page-label" id="pageLabel"></span>
  </div>
  <button class="turn" id="next">›</button>
  <button id="smaller">A−</button>
  <button id="bigger">A+</button>
  <button id="themeBtn">🌙</button>
  <button id="coverBtn" class="hide-sm">📕</button>
</nav>

<div class="toc" id="toc">
  <div class="toc-panel">
    <div class="toc-head">
      <h3>Contents</h3>
      <button id="tocClose">×</button>
    </div>
    <ol class="toc-list" id="tocList"></ol>
  </div>
</div>

// ============ STATE ============
let currentSpread = 0;
let totalSpreads = Math.ceil(pages.length / 2);
let fontSize = 17;
let theme = 'day';

// ============ RENDER ============
function renderSpread(spreadIndex) {
  spreadIndex = Math.max(0, Math.min(totalSpreads - 1, spreadIndex));
  currentSpread = spreadIndex;

  const leftIdx = spreadIndex * 2;
  const rightIdx = leftIdx + 1;

  renderPage('Left', pages[leftIdx], leftIdx);
  renderPage('Right', pages[rightIdx], rightIdx);

  document.getElementById('range').max = totalSpreads - 1;
  document.getElementById('range').value = spreadIndex;
  const endPage = Math.min(rightIdx + 1, pages.length);
  document.getElementById('pageLabel').textContent = `${leftIdx + 1}–${endPage} / ${pages.length}`;

  document.getElementById('prev').disabled = spreadIndex === 0;
  document.getElementById('next').disabled = spreadIndex >= totalSpreads - 1;

  saveState();
}

function renderPage(side, page, idx) {
  const content = document.getElementById('content' + side);
  const folio = document.getElementById('folio' + side);
  const rh = document.getElementById('rh' + side);

  if (page && page.title) {
    content.innerHTML = `<h2 class="chapter-title"><span class="ch-num">Page ${idx + 1}</span>${page.title}</h2>${page.content}`;
    content.scrollTop = 0;
    folio.textContent = idx + 1;
    rh.textContent = page.title;
  } else {
    content.innerHTML = '';
    folio.textContent = '';
    rh.textContent = '';
  }
}

// ============ CONTROLS ============
document.getElementById('next').onclick = () => renderSpread(currentSpread + 1);
document.getElementById('prev').onclick = () => renderSpread(currentSpread - 1);
document.getElementById('range').oninput = e => renderSpread(+e.target.value);

document.getElementById('bigger').onclick = () => {
  fontSize = Math.min(24, fontSize + 1);
  document.documentElement.style.setProperty('--font-size', fontSize + 'px');
  saveState();
};
document.getElementById('smaller').onclick = () => {
  fontSize = Math.max(14, fontSize - 1);
  document.documentElement.style.setProperty('--font-size', fontSize + 'px');
  saveState();
};

document.getElementById('themeBtn').onclick = () => {
  theme = theme === 'day' ? 'night' : 'day';
  document.documentElement.dataset.theme = theme;
  document.getElementById('themeBtn').textContent = theme === 'night' ? '☀️' : '🌙';
  saveState();
};

// ============ TOC ============
document.getElementById('tocBtn').onclick = () => {
  const list = document.getElementById('tocList');
  list.innerHTML = pages.map((p, i) =>
    `<li><button onclick="goToPage(${Math.floor(i/2)})">
      <span class="n">${i+1}</span>
      <span class="t">${p.title}</span>
    </button></li>`
  ).join('');
  document.getElementById('toc').classList.add('open');
};

document.getElementById('tocClose').onclick = () =>
  document.getElementById('toc').classList.remove('open');

document.getElementById('toc').onclick = e => {
  if (e.target.id === 'toc') document.getElementById('toc').classList.remove('open');
};

window.goToPage = function(spreadIdx) {
  renderSpread(spreadIdx);
  document.getElementById('toc').classList.remove('open');
};

// ============ COVER ============
document.getElementById('startBtn').onclick = () => {
  renderSpread(0);
  document.getElementById('cover').classList.add('hidden');
};

document.getElementById('continueBtn').onclick = () => {
  document.getElementById('cover').classList.add('hidden');
};

document.getElementById('coverBtn').onclick = () => {
  document.getElementById('cover').classList.remove('hidden');
};

// ============ KEYBOARD ============
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') renderSpread(currentSpread + 1);
  if (e.key === 'ArrowLeft') renderSpread(currentSpread - 1);
  if (e.key === 'Escape') document.getElementById('toc').classList.remove('open');
});

// ============ SAVE ============
function saveState() {
  try {
    localStorage.setItem('sajidBook', JSON.stringify({
      spread: currentSpread, fontSize, theme
    }));
  } catch(e) {}
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('sajidBook'));
    if (s) {
      fontSize = s.fontSize || 17;
      theme = s.theme || 'day';
      document.documentElement.style.setProperty('--font-size', fontSize + 'px');
      document.documentElement.dataset.theme = theme;
      document.getElementById('themeBtn').textContent = theme === 'night' ? '☀️' : '🌙';
      return s.spread || 0;
    }
  } catch(e) {}
  return 0;
}

// ============ INIT ============
const savedSpread = loadState();
renderSpread(savedSpread);
</script>
