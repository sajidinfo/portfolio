    <style>
        :root {
            --desk: #3b2a20;
            --desk-dark: #1c130d;

            --muted: #8a7b68;
            --accent: #a8322d;
            --spine: rgba(0, 0, 0, 0.16);
            --font-size: 18px;
        }

        :root[data-theme="night"] {
            --paper: #1f1d1a;
            --paper-edge: #12100e;
            --ink: #e6dccb;
            --muted: #9a8f7e;
            --accent: #e0827b;

            padding: 0;

        html, body {
            height: 100%;

        }

        body {

        .stage {

        }

        .book {
            position: relative;
            width: min(1180px, 100%, calc((100vh - 110px) * 1.45));

            border-radius: 6px;
            box-shadow:
                0 1px 0 var(--paper-edge),
                0 3px 0 -1px var(--paper),
                0 4px 0 -1px var(--paper-edge),

                0 7px 0 -2px var(--paper-edge),

        .book.spread::after {
            content: '';
            position: absolute;

            bottom: 0;
            left: 50%;

        /* ===== Cover ===== */

    <script type="text/plain" id="story">
# Dil Ki Baat 💖
## (The Heart's Voice)

>> For Gulista and Sultan — my whole world. ❤️

---

## Chapter 1: The Nikah 💍

This is a true story. It is a story about love. It is a story about a family. It is our story. ❤️

My name is Sajid. I am a software engineer. I also like to write. I am from Bhilwara, a small and beautiful city in Rajasthan. 🏙️

This is the story of me and my wife, Gulista. 💕

Our nikah was a beautiful day. The house was full of lights. There were flowers everywhere. There was music. There was good food. Everyone was smiling. 🌸

Gulista wore a red dress. She looked very beautiful. When I saw her, my heart stopped for a second. I could not stop smiling. 😊

**Sajid:** You look beautiful, Gulista. ❤️

**Gulista:** (She smiles and looks down.) Thank you. 😊

**Sajid:** Are you happy?

**Gulista:** Yes. But I am also a little scared. 🥺

**Sajid:** Scared? Why?

**Gulista:** Everything is new. A new home. A new life. What if something goes wrong? 😟

I smiled. Gulista always thinks a lot. She thinks about every small thing. She is an overthinker. But I love her for it. She thinks so much because she cares so much. 💭

**Sajid:** Don't worry. We will learn everything together. You and me. Always. 🤝

**Gulista:** Promise?

**Sajid:** Promise. ❤️

She smiled again. That smile is still my favourite thing in the world. 😊

That night, I looked at the sky. I said a small prayer.

"Ya Allah, thank you for Gulista. Please give us a happy life together." 🤲

I did not know it then. But our life was going to have many ups and downs. There were going to be happy days and sad days. But we were going to face all of them together. ❤️

---

## Chapter 2: The Storm 🌪️

After the nikah, life was sweet. But soon, a storm came. 🌪️

There was a big misunderstanding between our families. My parents and Gulista's parents did not agree on some things. Small problems became big problems. People said things in anger. Everyone was hurt. 😔

I will not write all the details here. They do not matter now. Every family has hard times. And everyone loves their children in their own way. ❤️

But those days were very difficult for us. 😢

Gulista was very sad. She stayed quiet most of the time. At night, she could not sleep. Her mind was always busy. 💭

**Gulista:** Sajid, is this my fault? 😢

**Sajid:** No, Gulista. It is not your fault. It is not anyone's fault. It is just a hard time. 🤗

**Gulista:** But everyone is angry. What will happen to us? What if things never get better? 😟

**Sajid:** Things will get better. InshaAllah. 🤲

I held her hand. Her hand was cold. I held it tighter. 🤝

I thought for many days. I prayed a lot. Then I made a big decision. 🤔

**Sajid:** Gulista, I want to go to Bangalore. I will find a job there. We will start a new life. Just you and me. 🏙️

**Gulista:** Bangalore? It is so far! 😲

**Sajid:** Yes, it is far. But maybe some distance is good for everyone. We need peace. Our families need time. 🕊️

Gulista was quiet for a long time. I could see that she was thinking. She was thinking about everything. 💭

Then she looked at me.

**Gulista:** Okay. If you are with me, I can go anywhere. ❤️

Those words gave me so much strength. 💪

We packed our bags. We said goodbye to Bhilwara. And we left for a new city. 🚆

---

## Chapter 3: A New City 🏙️

Bangalore was very big. ✨

There were tall buildings. There were many cars. There were people everywhere. Everyone was in a hurry. The weather was cool and nice. It was very different from Bhilwara. 🌤️

At first, we did not have a home. So we stayed in a PG. 🏢

The PG room was very small. There was one bed, one table, and one small cupboard. The food was not like home food. It was not bad. But it was not Ammi's cooking. 🍛

**Gulista:** Sajid, this room is so small. 😅

**Sajid:** Yes. But it is our first room in a new city. 😊

**Gulista:** The food is not good. I miss home food. 😔

**Sajid:** Me too. But it is only for a few days. Soon we will have our own home. And you can cook anything you want. 🏠

**Gulista:** What if we cannot find a good flat? What if the rent is too high? What if the owner is not nice? 😟

I laughed. 😂

**Sajid:** Gulista, you are thinking too much again!

**Gulista:** I am not! (Then she laughed too.) Okay, maybe a little. 😄

Every evening, we went for a walk. We looked at the new streets. We tried new food. We drank filter coffee. We learned some words in Kannada. ☕

**Sajid:** "Namaskara!" That means hello. 👋

**Gulista:** And "Dhanyavada" means thank you! 😊

We laughed like small children. 😂

That small PG room was not perfect. But we were together. And that was enough. ❤️

---

## Chapter 4: Our First Home 🏠

After one month, we found a flat. 🏠

It was not very big. But it was clean and bright. It had a small kitchen. It had a bedroom. It had a small balcony. From the balcony, we could see the trees and the sky. 🌳

When we got the keys, Gulista was so happy. Her eyes were shining. ✨

**Gulista:** Sajid, this is our home! Our own home! 🥳

**Sajid:** Yes, Gulista. Our first home. ❤️

We did not have much furniture. We had a mattress, two chairs, and some pots and pans. But we were very happy. 😊

We went shopping together. We bought curtains. We bought plates and cups. We bought a small plant for the balcony. 🪴

**Gulista:** Which curtains do you like? Blue or green? 🤔

**Sajid:** Blue. 💙

**Gulista:** Hmm. But green will look nice with the walls. And blue might look dark at night. And green is a fresh colour. But blue is also good… 💭

**Sajid:** Okay, okay! Green! 😂

**Gulista:** No, you said blue. Let's take blue. 😄

That is my Gulista. She thinks about everything. Even curtains! 😂

That night, Gulista cooked her first meal in our new home. Dal, rice, and roti. It was simple food. But for me, it was the best food in the world. 🍲

**Sajid:** This is delicious, Gulista! 😋

**Gulista:** Really? Is the salt okay? Is it too spicy? 😟

**Sajid:** It is perfect. Just like you. ❤️

She smiled and hit my arm softly. 😊

We sat on the balcony after dinner. The air was cool. The city lights were shining. ✨

**Gulista:** Sajid, I am happy. Really happy. 😊

**Sajid:** Me too, Gulista. Me too. ❤️

---

## Chapter 5: Same Office, Same Heart 💻

Gulista and I worked in the same company. 💻

Every morning, we woke up early. We prayed together. We had breakfast together. Then we went to the office together. 🌅

We worked from Monday to Friday. The work was hard. There were many meetings. There were many deadlines. But it was nice to have Gulista near me. 😊

Sometimes, I looked at her desk from far away. She was always busy. She was always focused. When she saw me looking, she smiled. Then she quickly looked back at her screen. 😄

At lunch time, we ate together in the office cafe. 🍱

**Gulista:** How is your work today? 🤔

**Sajid:** Very busy. Too many bugs in the code! 🐛

**Gulista:** Ha! Don't worry. You will fix them. You always do. 😊

**Sajid:** And how is your work?

**Gulista:** I have a big meeting at 4 o'clock. What if my manager does not like my work? What if I forget something? 😟

**Sajid:** You will do great. You always prepare very well. 💪

**Gulista:** You think so?

**Sajid:** I know so. ❤️

And she did great. She always did. 🌟

After work, we went home together. Sometimes we were very tired. We ordered food. We watched a movie. Sometimes we just talked on the balcony. 🌙

Some people say it is not good to work with your wife. But for us, it was nice. We understood each other's work. We understood each other's stress. We helped each other. 🤝

We were a team. At work and at home. ❤️

---

## Chapter 6: Weekend Wanderers 🚗

From Monday to Friday, we worked hard. But Saturday and Sunday were our days. We loved weekends! 🥳

Every weekend, we went out. We explored Bangalore. 🗺️

**Gulista:** I need some time, Sajid. I am going to my parents' house. 😢

## Chapter 17: Darjeeling Alone 🏔️

I could not stay in the empty house anymore. Every corner reminded me of them. 😢

So I went to Darjeeling. I wanted to think. I wanted to understand my heart. 🏔️

Darjeeling was beautiful. There were green tea gardens everywhere. There were clouds on the mountains. The air was cold and fresh. 🍃

One morning, I woke up very early. I went to a high place. I waited for the sunrise. 🌄

The sun came up behind the mountains. The snow on the mountain peaks turned gold. It was so beautiful. ✨

And at that moment, I remembered Nandi Hills. 🌅

I remembered Gulista shivering in my jacket. I remembered her saying, "Subhan Allah, it is so beautiful." I remembered how I looked at her, not at the sunrise. 💭

I wanted to show her this sunrise. I wanted Sultan to see these mountains. But they were not with me. 💔

I sat there for a long time. I thought about everything. 💭

I thought about our nikah. About the PG room. About our first home. About the green curtains. About the pani puri at midnight. About Sultan's first word. About his first steps. 👣

And I understood something. 💡

Being right is not important. Winning a fight is not important. Ego is not important. 🙅‍♂️

Only love is important. Only family is important. ❤️

Gulista's overthinking was not a problem. It was her heart. She thinks so much because she loves so much. I needed to listen to her worries. Not ignore them. 💭❤️

That night, I took out my phone. I looked at her photo for a long time. 📱

I made a decision. I will go and bring my family home. 🏡

**Sultan:** Okay! Then group hug! 🤗

And the three of us hugged. Tight. Together. 🤗❤️

Our story is not perfect. But it is ours. And it is full of love. ❤️

Family is not about being perfect. Family is about staying together. In happy times and in hard times. Always. 👨‍👩‍👦

    </script>

    <script>
        const $ = id => document.getElementById(id);
        const flow = $('flow');
        const viewport = $('viewport');
        const book = $('book');

        // ===== Saved reading position (per browser) =====
        const store = {
            get() {
                try { return JSON.parse(localStorage.getItem('dilKiBaat')) || {}; } catch (e) { return {}; }
            },
            set(value) {
                try { localStorage.setItem('dilKiBaat', JSON.stringify(value)); } catch (e) {}
            }
        };
        const state = Object.assign({ page: 0, size: 18, theme: 'day' }, store.get());
        const chapters = [];

        // ===== Turn the story text into book HTML =====
        function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function inline(s) {
            return esc(s)
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>');
        }

        function buildBook() {
            const lines = $('story').textContent.split(/\r?\n/);
            let html = '';
            let firstPara = false;

            for (const raw of lines) {
                const t = raw.trim();
                if (!t || t === '---') continue;

                let m;
                if (t.startsWith('# ')) {
                    html += `<h1 class="book-title">${inline(t.slice(2))}</h1>`;
                } else if ((m = t.match(/^## Chapter (\d+):\s*(.*)$/))) {
                    const id = 'ch' + m[1];
                    chapters.push({ num: +m[1], title: m[2], id });
                    html += `<h2 class="chapter" id="${id}"><span class="ch-num">Chapter ${m[1]}</span>` +
                            `<span class="ch-title">${inline(m[2])}</span></h2>`;
                    firstPara = true;
                } else if (t.startsWith('## ')) {
                    html += `<p class="book-subtitle">${inline(t.slice(3).replace(/^\(|\)$/g, ''))}</p>`;
                } else if (t.startsWith('>> ')) {
                    // Dedication page
                    html += `<p class="dedication">${inline(t.slice(3))}</p>`;
                } else if (t.startsWith('> ')) {
                    // Letter paragraph
                    html += `<p class="letter">${inline(t.slice(2))}</p>`;
                } else if ((m = t.match(/^\*\*The End\*\*\s*(.*)$/))) {
                    html += `<p class="the-end">The End ${esc(m[1])}</p>`;
                } else if ((m = t.match(/^\*\*([^*]+):\*\*\s*(.*)$/))) {
                    html += `<p class="line"><span class="speaker">${esc(m[1])}</span> ${inline(m[2])}</p>`;
                    firstPara = false;
                } else if ((m = t.match(/^\*([^*].*?)\*(.*)$/))) {
                    html += `<blockquote><em>${inline(m[1])}</em>${inline(m[2])}</blockquote>`;
                } else {
                    html += `<p${firstPara ? ' class="first"' : ''}>${inline(t)}</p>`;
                    firstPara = false;
                }
            }

            flow.innerHTML = html + '<span id="endMark"></span>';
        }

        // ===== Pagination using CSS columns =====
        let cols = 2;
        let gap = 120;
        let step = 1;
        let total = 1;
        let spread = 0;

        function pageOf(el) {
            const x = el.getBoundingClientRect().left - flow.getBoundingClientRect().left;
            return Math.max(0, Math.floor((x + 2) / step));
        }

        function firstVisibleElement() {
            const firstPage = spread * cols;
            for (const el of flow.children) {
                if (pageOf(el) >= firstPage) return el;
            }
            return null;
        }

        function layout(anchor) {
            const isSpread = window.innerWidth >= 900;
            book.classList.toggle('spread', isSpread);
            cols = isSpread ? 2 : 1;
            gap = isSpread ? 120 : 44;
            document.documentElement.style.setProperty('--font-size', state.size + 'px');
            document.documentElement.dataset.theme = state.theme;
            $('themeBtn').textContent = state.theme === 'night' ? '☀️' : '🌙';

            const vw = viewport.clientWidth;
            const vh = viewport.clientHeight;
            flow.style.transition = 'none';
            flow.style.transform = 'none';
            flow.style.width = vw + 'px';
            flow.style.height = vh + 'px';
            flow.style.columnCount = cols;
            flow.style.columnGap = gap + 'px';
            step = (vw - gap * (cols - 1)) / cols + gap;

            total = pageOf($('endMark')) + 1;
            chapters.forEach(c => { c.page = pageOf($(c.id)); });

            const target = anchor ? pageOf(anchor) : Math.min(state.page, total - 1);
            show(target, false);
        }

        function show(page, animate = true) {
            page = Math.max(0, Math.min(total - 1, page));
            spread = Math.floor(page / cols);
            const first = spread * cols;

            flow.style.transition = animate ? 'transform 0.55s cubic-bezier(.4,.1,.2,1)' : 'none';
            flow.style.transform = `translateX(${-spread * (viewport.clientWidth + gap)}px)`;

            state.page = first;
            store.set(state);

            const a = first + 1;
            const b = cols === 2 && a < total ? a + 1 : null;
            $('folioL').textContent = a;
            $('folioR').textContent = b || '';
            $('pageLabel').textContent = (b ? `${a}–${b}` : a) + ' / ' + total;

            const range = $('range');
            range.max = Math.ceil(total / cols) - 1;
            range.value = spread;
            $('prev').disabled = spread === 0;
            $('next').disabled = first + cols >= total;

            const current = currentChapter();
            $('runningHead').textContent = current ? `Chapter ${current.num}` : '';
        }

        function currentChapter() {
            const last = spread * cols + cols - 1;
            let found = null;
            for (const c of chapters) {
                if (c.page <= last) found = c;
            }
            return found;
        }

        const next = () => show((spread + 1) * cols);
        const prev = () => show((spread - 1) * cols);

        // ===== Controls =====
        $('next').onclick = next;
        $('prev').onclick = prev;
        $('range').oninput = e => show(+e.target.value * cols, false);

        function changeSize(delta) {
            const anchor = firstVisibleElement();
            state.size = Math.max(14, Math.min(26, state.size + delta));
            layout(anchor);
        }
        $('smaller').onclick = () => changeSize(-1);
        $('bigger').onclick = () => changeSize(1);

        $('themeBtn').onclick = () => {
            state.theme = state.theme === 'night' ? 'day' : 'night';
            document.documentElement.dataset.theme = state.theme;
            $('themeBtn').textContent = state.theme === 'night' ? '☀️' : '🌙';
            store.set(state);
        };

        // Tap left / right side of the page to turn
        book.addEventListener('click', e => {
            if (window.getSelection().toString()) return;
            const rect = book.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            if (x < 0.3) prev();
            else if (x > 0.7) next();
        });

        // Swipe on mobile
        let touchX = 0, touchY = 0;
        book.addEventListener('touchstart', e => {
            touchX = e.touches[0].clientX;
            touchY = e.touches[0].clientY;
        }, { passive: true });
        book.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchX;
            const dy = e.changedTouches[0].clientY - touchY;
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
                dx < 0 ? next() : prev();
            }
        });

        document.addEventListener('keydown', e => {
            if (document.body.classList.contains('cover-open')) {
                if (e.key === 'Enter') openBook();
                return;
            }
            if (e.key === 'Escape') closeToc();
            if ($('toc').classList.contains('open')) return;
            if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
            if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            const anchor = firstVisibleElement();
            resizeTimer = setTimeout(() => layout(anchor), 150);
        });

        // ===== Contents =====
        function openToc() {
            const current = currentChapter();
            $('tocList').innerHTML = chapters.map(c =>
                `<li><button data-page="${c.page}" class="${c === current ? 'current' : ''}">` +
                `<span class="n">${c.num}</span><span class="t">${inline(c.title)}</span>` +
                `<span class="p">${c.page + 1}</span></button></li>`
            ).join('');
            $('toc').classList.add('open');
        }

        function closeToc() {
            $('toc').classList.remove('open');
        }

        $('tocBtn').onclick = openToc;
        $('tocClose').onclick = closeToc;
        $('toc').addEventListener('click', e => {
            const btn = e.target.closest('button[data-page]');
            if (btn) {
                show(+btn.dataset.page, false);
                closeToc();
            } else if (e.target.id === 'toc') {
                closeToc();
            }
        });

        // ===== Cover =====
        function openBook(page) {
            if (page !== undefined) show(page, false);
            $('cover').classList.add('opening');
            setTimeout(() => {
                $('cover').classList.add('hidden');
                document.body.classList.remove('cover-open');
            }, 750);
        }

        function backToCover() {
            updateContinue();
            $('cover').classList.remove('hidden', 'opening');
            document.body.classList.add('cover-open');
        }

        function updateContinue() {
            const btn = $('continueBtn');
            btn.hidden = state.page === 0;
            btn.textContent = `Continue from page ${state.page + 1}`;
        }

        $('startBtn').onclick = () => openBook(0);
        $('continueBtn').onclick = () => openBook();
        $('coverBtn').onclick = backToCover;

        // ===== Start =====
        buildBook();
        layout();
        updateContinue();
        if (document.fonts) {
            document.fonts.ready.then(() => layout(firstVisibleElement()));
        }
    </script>
</body>
</html>
